  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(135deg,#667eea,#764ba2); color:#333; height:100vh; display:flex; flex-direction:column;}
    .header{text-align:center;padding:20px;color:white;}
    .chat-area{flex:1;background:white;border-radius:12px;margin:10px;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
    .message{padding:10px;border-radius:12px;max-width:80%;word-wrap:break-word;}
    .user-message{background:#e0f7fa;align-self:flex-end;}
    .ai-message{background:#f1f1f1;align-self:flex-start;}
    .input-area{padding:10px;background:rgba(255,255,255,0.1);display:flex;gap:10px;}
    input[type="text"]{flex:1;padding:10px;border-radius:20px;border:1px solid #ccc;}
    button{padding:10px 20px;border-radius:20px;border:none;color:white;font-weight:bold;cursor:pointer;}
    #sendButton{background:#4CAF50;}#jokeButton{background:#ff9800;}#voiceButton{background:#2196F3;}
  </style>
</head>
<body>
  <div class="header">
    <h1>Lily AI Companion</h1>
    <p style="color:white;">Offline + Voice Enabled + Installable App</p>
  </div>
  <div class="chat-area" id="chatArea">
    <div style="text-align:center;color:#666;">💭 Hi! I'm Lily. Say "talk to me" for voice mode.</div>
  </div>
  <div class="input-area">
    <input id="messageInput" type="text" placeholder="Type your message...">
    <button id="sendButton" type="button">Send</button>
    <button id="jokeButton" type="button">Tell me a joke</button>
    <button id="voiceButton" type="button">🎤 Voice</button>
  </div>

<script>
  let voiceMode=false;
  const chatArea=document.getElementById('chatArea'),messageInput=document.getElementById('messageInput');
  function addMessage(text,sender){const div=document.createElement('div');div.className=`message ${sender}-message`;div.textContent=text;chatArea.appendChild(div);chatArea.scrollTop=chatArea.scrollHeight;}
  function getOfflineResponse(msg){const lower=msg.toLowerCase();if(lower.includes("joke"))return"Why did the computer go to therapy? It had too many bugs! 😂";if(lower.includes("code"))return"Here's a simple JavaScript snippet:\nfunction greet(){console.log('Hello!');}";if(lower.includes("sad"))return"I'm sorry you're feeling sad. You're not alone—I’m here for you.";if(lower.includes("happy"))return"That’s great! I’m happy for you!";if(lower.includes("talk to me")){voiceMode=true;return"Voice mode activated! I'm listening continuously.";}return"I hear you. Tell me more!";}
  function speak(text){const u=new SpeechSynthesisUtterance(text);u.lang='en-US';speechSynthesis.speak(u);}
  function startVoice(){const r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();r.lang='en-US';r.continuous=true;r.start();r.onresult=e=>{const voiceText=e.results[e.results.length-1][0].transcript;addMessage(voiceText,'user');const res=getOfflineResponse(voiceText);addMessage(res,'ai');if(voiceMode)speak(res);};}
  document.getElementById('sendButton').onclick=()=>{const msg=messageInput.value.trim();if(!msg)return;messageInput.value='';addMessage(msg,'user');const res=getOfflineResponse(msg);addMessage(res,'ai');if(voiceMode)speak(res);};
  document.getElementById('jokeButton').onclick=()=>{const res=getOfflineResponse("joke");addMessage(res,'ai');if(voiceMode)speak(res);};
  document.getElementById('voiceButton').onclick=()=>{startVoice();addMessage("Listening... Say 'talk to me' to activate voice responses.",'ai');};
  if('serviceWorker'in navigator){navigator.serviceWorker.register('service-worker.js');}
</script>
</body>
</html>
